name: UniversalCamPhone
options:
  bundleIdPrefix: com.universalcam
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    VALID_ARCHS: arm64

targets:
  UniversalCamPhone:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UniversalCamPhone
        excludes:
          - "**/*.md"
      - path: Media.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universalcam.phone
        PRODUCT_NAME: UniversalCam
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only
        VALID_ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""              # Set your Team ID here or via Xcode
        INFOPLIST_FILE: UniversalCamPhone/Info.plist
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: UniversalCamPhone/Info.plist
      properties:
        CFBundleName: UniversalCam
        CFBundleDisplayName: UniversalCam
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.1.1"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "UniversalCam uses your camera to stream video to your Windows PC."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies: []

  UniversalCamPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
      - path: UniversalCamPhone/Camera/AnnexB.swift
      - path: UniversalCamPhone/UI/StreamingScreenDimmer.swift
      - path: UniversalCamPhone/Diagnostics/DiagnosticLog.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        CODE_SIGNING_ALLOWED: NO

schemes:
  UniversalCamPhone:
    build:
      targets:
        UniversalCamPhone: all
        UniversalCamPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UniversalCamPhoneTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
