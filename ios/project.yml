name: CamoRip
options:
  bundleIdPrefix: com.camorip
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    VALID_ARCHS: arm64

targets:
  CamoRip:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CamoRipPhone
        excludes:
          - "**/*.md"
      - path: Media.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camorip.phone
        PRODUCT_NAME: CamoRip
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only
        VALID_ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""              # Set your Team ID here or via Xcode
        INFOPLIST_FILE: CamoRipPhone/Info.plist
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: CamoRipPhone/Info.plist
      properties:
        CFBundleName: CamoRip
        CFBundleDisplayName: CamoRip
        CFBundleVersion: "9"
        CFBundleShortVersionString: "0.4.0"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "CamoRip uses your camera to stream video to your Windows PC."
        NSLocalNetworkUsageDescription: "CamoRip connects to your paired Windows PC to stream camera video over your local Wi-Fi network."
        NSBonjourServices:
          - "_camorip._tcp"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies: []

  CamoRipTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
      - path: CamoRipPhone/Camera/CameraControlProtocol.swift
      - path: CamoRipPhone/Camera/CaptureMirroring.swift
      - path: CamoRipPhone/Camera/CameraSession.swift
      - path: CamoRipPhone/Camera/CameraControls.swift
      - path: CamoRipPhone/Camera/VideoEncoder.swift
      - path: CamoRipPhone/Transport/ConnectionManager.swift
      - path: CamoRipPhone/Transport/USBTransport.swift
      - path: CamoRipPhone/Transport/StreamingDependencies.swift
      - path: CamoRipPhone/Transport/AutomaticPhoneTransport.swift
      - path: CamoRipPhone/Transport/WirelessPeer.swift
      - path: CamoRipPhone/Camera/AnnexB.swift
      - path: CamoRipPhone/UI/StreamingScreenDimmer.swift
      - path: CamoRipPhone/Diagnostics/DiagnosticLog.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        CODE_SIGNING_ALLOWED: NO

schemes:
  CamoRip:
    build:
      targets:
        CamoRip: all
        CamoRipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CamoRipTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
