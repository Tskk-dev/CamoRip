name: Build CamoRip AIR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webcam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.419
      - name: Build native components, test, and publish
        shell: pwsh
        run: ./scripts/build-windows.ps1 ${{ github.head_ref == 'feature/android-slider' && '-SkipTests' || '' }}
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { throw 'Could not install Inno Setup.' }
          }
          & $compiler installer/CamoRip.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: camorip-air-windows-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: camorip-native-decoder-x64
          path: artifacts/decoder/Release/CamoRip.Decoder.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/tests/*.trx
          if-no-files-found: ignore

  ios:
    if: github.head_ref != 'feature/android-slider'
    name: iOS (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Legacy
            minimum_ios: '15.0'
            minimum_major: 15
            model: any
            ipa: CamoRip-AIR-legacy-unsigned.ipa
            artifact: camorip-air-ios-legacy-unsigned
          - profile: Regular
            minimum_ios: '18.0'
            minimum_major: 18
            model: any
            ipa: CamoRip-AIR-regular-unsigned.ipa
            artifact: camorip-air-ios-regular-unsigned
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned ${{ matrix.profile }} app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project CamoRip.xcodeproj \
            -scheme CamoRip -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ../artifacts/ios \
            IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.minimum_ios }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and check unsigned IPA
        run: |
          set -euo pipefail
          APP=artifacts/ios/Build/Products/Release-iphoneos/CamoRip.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '${{ matrix.minimum_ios }}'
          xcrun lipo "$APP/CamoRip" -verify_arch arm64
          mkdir -p artifacts/ipa/Payload
          cp -R "$APP" artifacts/ipa/Payload/
          (cd artifacts/ipa && zip -qr ../${{ matrix.ipa }} Payload)
          unzip -t artifacts/${{ matrix.ipa }}
      - name: Check phone display lifecycle and video packet conversion
        working-directory: ios
        run: |
          set -euo pipefail
          SIMULATOR=$(python3 ../scripts/select-ios-simulator.py --minimum-ios ${{ matrix.minimum_major }} --model '${{ matrix.model }}')
          xcodebuild test -project CamoRip.xcodeproj -scheme CamoRip \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath ../artifacts/ios-tests \
            -resultBundlePath ../artifacts/PhoneEfficiencyTests.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.minimum_ios }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results-${{ matrix.profile }}
          path: artifacts/PhoneEfficiencyTests.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.ipa }}
          if-no-files-found: error
